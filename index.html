<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="bgmusic" loop>
    <source src="images/music.mp3" type="audio/mp3">
</audio>

<!-- ❤️ Heart Rain -->
<div class="hearts" id="hearts"></div>

<!-- 🎁 Gift Screen -->
<div id="giftScreen" class="screen">

    <div class="gift">🎁</div>

    <h1 class="glow">Hi... ❤️</h1>

    <p>Kuchh Kahna Tha Aapse...</p>

    <button onclick="openGift()">💌 Open This</button>

</div>

<!-- 💌 Message Screen -->
<div id="messageScreen" class="screen" style="display:none;">

    <h2 id="typing"></h2>

    <img id="gif" src="">

    <button id="nextBtn" onclick="nextMessage()">
        Next ❤️
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
